<script>
/* Escape closes the open menu first; a second Escape closes the dialog behind it */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  var layers = document.querySelectorAll('.tk-overlay');
  if (!layers.length) return;
  var trigger = document.querySelector('[aria-haspopup][aria-expanded="true"]');
  layers[layers.length - 1].click();
  e.stopPropagation();
  if (trigger) setTimeout(function () { trigger.focus(); }, 0);
});
</script>
